[project]
name = "travelbooking"
version = "1.0.0"
description = "Production-ready Django travel booking platform."
requires-python = ">=3.11"
dependencies = [
    "Django==6.0.7",
    "django-cors-headers==4.9.0",
    "django-jazzmin==3.0.5",
    "djangorestframework==3.17.1",
    "drf-spectacular==0.30.0",
    "gunicorn==26.0.0",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "python-dotenv==1.2.2",
    "reportlab==5.0.0",
    "tzdata==2026.3",
    "whitenoise==6.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
exclude = [
    ".venv",
    "staticfiles",
    "*/migrations/*",
    "*/tests.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # long lines handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before Django is imported.
"travel_booking/wsgi.py" = ["E402"]
"travel_booking/asgi.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts", "bookings", "dashboard", "flights", "home", "hotels",
    "maps", "notifications", "packages", "payments", "reviews",
    "travel_booking",
]

[tool.black]
line-length = 100
target-version = ["py311"]
