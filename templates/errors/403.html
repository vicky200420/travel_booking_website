{% extends 'base.html' %}
{% load static %}

{% block title %}Access Denied — TravelBooking{% endblock %}

{% block content %}
<section class="error-page">
    <div class="error-wrap anim-fade-up">
        <div class="error-code">403</div>
        <div class="error-icon">
            <i class="bi bi-shield-lock" aria-hidden="true"></i>
        </div>
        <h1 class="error-title">Access denied</h1>
        <p class="error-desc">You don't have permission to view this page. If you believe this is a mistake, contact support.</p>
        <div class="error-actions">
            <a href="{% url 'home' %}" class="btn btn-gradient"><i class="bi bi-house-door me-1" aria-hidden="true"></i>Back to Home</a>
            <a href="{% url 'login' %}" class="btn btn-outline-primary"><i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>Sign In</a>
        </div>
    </div>
</section>
{% endblock %}
