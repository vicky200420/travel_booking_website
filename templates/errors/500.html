{% extends 'base.html' %}
{% load static %}

{% block title %}Server Error — TravelBooking{% endblock %}

{% block content %}
<section class="error-page">
    <div class="error-wrap anim-fade-up">
        <div class="error-code">500</div>
        <div class="error-icon">
            <i class="bi bi-tools" aria-hidden="true"></i>
        </div>
        <h1 class="error-title">Something went wrong</h1>
        <p class="error-desc">An unexpected error occurred on our end. Our team has been notified — please try again shortly.</p>
        <div class="error-actions">
            <a href="{% url 'home' %}" class="btn btn-gradient"><i class="bi bi-house-door me-1" aria-hidden="true"></i>Back to Home</a>
            <a href="javascript:history.back()" class="btn btn-outline-primary"><i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>Try Again</a>
        </div>
    </div>
</section>
{% endblock %}
