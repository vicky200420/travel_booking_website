{% extends 'base.html' %}
{% load static %}

{% block title %}Bad Request — TravelBooking{% endblock %}

{% block content %}
<section class="error-page">
    <div class="error-wrap anim-fade-up">
        <div class="error-code">400</div>
        <div class="error-icon">
            <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
        </div>
        <h1 class="error-title">Bad request</h1>
        <p class="error-desc">We couldn't understand your request. Please go back and try again.</p>
        <div class="error-actions">
            <a href="{% url 'home' %}" class="btn btn-gradient"><i class="bi bi-house-door me-1" aria-hidden="true"></i>Back to Home</a>
            <a href="javascript:history.back()" class="btn btn-outline-primary"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Go Back</a>
        </div>
    </div>
</section>
{% endblock %}
