{% include 'components/breadcrumbs.html' %}
<header class="page-header">
    <div class="container">
        <div class="page-header-inner">
            <div class="page-header-text">
                {% if page_eyebrow %}<span class="page-eyebrow">{{ page_eyebrow }}</span>{% endif %}
                <h1 class="page-title">
                    {% if page_icon %}<i class="bi {{ page_icon }}"></i>{% endif %}
                    {{ page_title }}
                </h1>
                {% if page_subtitle %}<p class="page-subtitle">{{ page_subtitle }}</p>{% endif %}
            </div>
            <div class="page-actions">
                {% if page_actions_template %}{% include page_actions_template %}{% endif %}
            </div>
        </div>
    </div>
</header>
