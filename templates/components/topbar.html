{% load static %}
<header class="dash-topbar">
    <div class="dash-topbar-left">
        <button class="dash-menu-toggle btn btn-light" data-bs-toggle="offcanvas" data-bs-target="#dashSidebarOffcanvas" aria-label="Toggle menu">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <div class="dash-page-title">
            <h1>{{ page_title }}</h1>
            <p>{{ user.get_full_name|default:user.username }}, welcome back to your travel hub</p>
        </div>
    </div>

    <div class="dash-topbar-right">
        <form class="dash-global-search d-none d-md-flex" action="{% url 'dashboard_bookings' %}" method="get" role="search">
            <label class="visually-hidden" for="dashSearch">Search your bookings</label>
            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search" aria-hidden="true"></i></span>
            <input type="search" name="q" id="dashSearch" class="form-control" placeholder="Search your bookings…" value="{{ search_query|default:'' }}">
        </form>

        <ul class="navbar-nav flex-row align-items-center gap-2">
            {% include 'notifications/notification_dropdown.html' %}
        </ul>

        <a href="{% url 'dashboard_settings' %}?tab=picture" class="dash-topbar-avatar" title="Edit profile picture" aria-label="Edit profile picture">
            {% if user.profile_image %}
                <img src="{{ user.profile_image.url }}" alt="{{ user.username }}">
            {% else %}
                <span aria-hidden="true">{{ user.username|first|upper }}</span>
            {% endif %}
        </a>
    </div>
</header>
