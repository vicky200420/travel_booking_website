{% load static %}
<label class="form-label mb-0 text-nowrap small fw-medium">Sort by:</label>
<select class="form-select form-select-sm ms-2" id="sortSelect" style="width:auto;min-width:160px;">
    <option value="price_low" {% if form.sort_by.value == 'price_low' %}selected{% endif %}>Lowest Price</option>
    <option value="price_high" {% if form.sort_by.value == 'price_high' %}selected{% endif %}>Highest Price</option>
    <option value="fastest" {% if form.sort_by.value == 'fastest' %}selected{% endif %}>Fastest Flight</option>
    <option value="earliest_departure" {% if form.sort_by.value == 'earliest_departure' %}selected{% endif %}>Earliest Departure</option>
    <option value="latest_departure" {% if form.sort_by.value == 'latest_departure' %}selected{% endif %}>Latest Departure</option>
</select>
