{% load static %}
<div class="search-sidebar glass-card p-4">
    <form method="GET" action="{% url 'package_search' %}" id="packageSearchForm" class="needs-validation" novalidate>
        <div class="mb-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-search me-2"></i>Search Packages</h5>
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="bi bi-geo-alt me-1"></i>Destination
                </label>
                {{ form.destination }}
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="bi bi-globe me-1"></i>Country
                </label>
                {{ form.country }}
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="bi bi-tag me-1"></i>Category
                </label>
                {{ form.category }}
            </div>
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold mb-0"><i class="bi bi-currency-dollar me-1"></i>Budget</h6>
                <span class="small text-muted">per person</span>
            </div>
            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label small">Min</label>
                    {{ form.min_price }}
                </div>
                <div class="col-6">
                    <label class="form-label small">Max</label>
                    {{ form.max_price }}
                </div>
            </div>
        </div>

        <div class="mb-4">
            <h6 class="fw-bold mb-2"><i class="bi bi-clock me-1"></i>Duration</h6>
            {{ form.duration }}
        </div>

        <div class="mb-4">
            <h6 class="fw-bold mb-2"><i class="bi bi-star me-1"></i>Minimum Rating</h6>
            <div class="star-rating-filter d-flex gap-1 flex-wrap">
                {% for i in "54321"|make_list %}
                    <label class="star-option">
                        <input type="radio" name="min_rating" value="{{ i }}"
                               {% if form.min_rating.value|stringformat:"s" == i|stringformat:"s" %}checked{% endif %}>
                        <span class="star-label">{{ i }}<i class="bi bi-star-fill ms-1"></i></span>
                    </label>
                {% endfor %}
            </div>
        </div>

        <div class="mb-4">
            <div class="form-check">
                {{ form.featured }}
                <label class="form-check-label fw-medium" for="{{ form.featured.id_for_label }}">
                    <i class="bi bi-star-fill text-warning me-1"></i>Featured Packages Only
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-gradient w-100 btn-ripple mb-2">
            <span><i class="bi bi-search me-2"></i>Search Packages</span>
        </button>
        <a href="{% url 'package_list' %}" class="btn btn-outline-primary w-100 btn-ripple">
            <span><i class="bi bi-x-circle me-2"></i>Clear Filters</span>
        </a>
    </form>
</div>
